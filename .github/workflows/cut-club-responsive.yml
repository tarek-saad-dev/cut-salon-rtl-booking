name: CUT CLUB Responsive Browser Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - src/app/cut-club/**
      - src/components/MainNav.tsx
      - src/components/GlobalMobileNav.tsx
      - src/components/MobileMenuSheet.tsx
      - e2e/cut-club-responsive.spec.ts
      - playwright.cut-club.config.ts
      - .github/workflows/cut-club-responsive.yml

permissions:
  contents: read

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build CUT Salon site
        run: npm run build
      - name: Check mobile, tablet and desktop in browser
        run: npx playwright test --config playwright.cut-club.config.ts
