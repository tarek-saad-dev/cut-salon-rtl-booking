name: December Browser Journey
on:
  pull_request:
    branches: [main]
    paths:
      - 'src/app/offers/december/**'
      - 'src/app/api/offers/december/**'
      - 'src/lib/december/**'
      - 'tests/december-browser/**'
      - 'playwright.december.config.ts'
      - '.github/workflows/december-browser.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.december.config.ts
