name: CUT CLUB Live Public HTTP Smoke (Read Only)

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cut-club-live-http-smoke.yml

permissions:
  contents: read

jobs:
  verify:
    name: Verify public CUT CLUB on cutsaloon.com
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate live page HTTP status, content and sitemap
        shell: bash
        run: |
          set -euo pipefail
          hostname='https://cutsaloon.com'
          curl --fail --silent --show-error --location --max-time 30 \
            --retry 2 --retry-delay 2 \
            -D /tmp/cutclub_headers.txt \
            -o /tmp/cutclub_live.html \
            "$hostname/cut-club"
          grep -Eq '^HTTP/[^ ]+ 200' /tmp/cutclub_headers.txt
          grep -Fq 'CUT CLUB' /tmp/cutclub_live.html
          grep -Fq 'ما هو CUT CLUB؟' /tmp/cutclub_live.html
          ! grep -Eiq '<meta[^>]+name=["'\''"]robots["'\''"][^>]+noindex' /tmp/cutclub_live.html
          curl --fail --silent --show-error --location --max-time 30 \
            -o /tmp/cutclub_sitemap.xml "$hostname/sitemap.xml"
          grep -Fq 'https://cutsaloon.com/cut-club' /tmp/cutclub_sitemap.xml
          echo 'CUT CLUB LIVE PUBLIC ROUTE VERIFIED (200, SSR content, sitemap)'
