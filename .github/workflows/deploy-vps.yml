name: Deploy Client to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: cut-client-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.VPS_SSH_KEY_B64 }}" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "Testing private key format..."
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null

          echo "SSH private key is valid"

      - name: Deploy production
        shell: bash
        run: |
          ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "/usr/local/sbin/deploy-cutclient"