name: Deploy Client to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: cut-client-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy production
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "VPS_CLIENT_REPO=${{ secrets.VPS_CLIENT_REPO }} sudo -E bash -s" \
            < .github/scripts/vps-deploy-remote.sh
