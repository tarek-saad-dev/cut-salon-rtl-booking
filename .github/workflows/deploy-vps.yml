name: Deploy Client to VPS

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: cut-client-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy production
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "sudo bash -c '
              set -euo pipefail
              SCRIPT=/usr/local/sbin/deploy-cutclient
              REPO=\"${{ secrets.VPS_CLIENT_REPO }}\"

              if [ -z \"\$REPO\" ] && [ -f \"\$SCRIPT\" ]; then
                REPO=\$(grep -E \"^(REPO|REPO_DIR|APP_DIR|GIT_DIR)=\" \"\$SCRIPT\" 2>/dev/null | head -1 | cut -d= -f2- | tr -d \"\\\"'"'"' \\\" || true)
              fi
              if [ -z \"\$REPO\" ] && [ -f \"\$SCRIPT\" ]; then
                REPO=\$(grep -Eo \"cd [^ ;]+\" \"\$SCRIPT\" 2>/dev/null | head -1 | awk \"{print \\\$2}\" | tr -d \"\\\"'"'"'\" || true)
              fi

              if [ -n \"\$REPO\" ] && [ -d \"\$REPO/.git\" ]; then
                echo \"Resetting repository at \$REPO\"
                git -C \"\$REPO\" status --short || true
                git -C \"\$REPO\" reset --hard HEAD
                git -C \"\$REPO\" clean -fd
              else
                echo \"WARN: Could not resolve client repo path; deploy may fail if repo is dirty\"
              fi

              exec \"\$SCRIPT\"
            '"
