# Example only; integrate into the real website nginx vhost after review.
# NOT automatically loaded. Use trusted real_ip configuration if behind a CDN.
# Never use an unvalidated X-Forwarded-For header as a rate-limit key.
# HTTP context:
limit_req_zone $binary_remote_addr zone=december_registration:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=december_recovery:10m rate=4r/m;
# Website server context — merge the existing app proxy settings and upstream.
# Keep backend Casher endpoints restricted to the BFF shared-key boundary.
location = /api/offers/december/register {
    limit_req zone=december_registration burst=4 nodelay;
    limit_req_status 429;
    client_max_body_size 8k;
    # Include the existing website proxy configuration here.
    # proxy_pass http://EXISTING_WEBSITE_UPSTREAM;
    return 503; # fail closed until reviewed and replaced with the real proxy
}
location = /api/offers/december/recover {
    limit_req zone=december_recovery burst=3 nodelay;
    limit_req_status 429;
    client_max_body_size 1k;
    # Include the existing website proxy configuration here.
    return 503; # fail closed until reviewed and replaced with the real proxy
}
